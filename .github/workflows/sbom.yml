name: Generate SBOM

on:
  push:
    branches: [main]
  release:
    types: [created]

permissions: read-all

jobs:
  sbom:
    name: Generate and publish SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: aston-attestation-sdk-sbom.spdx.json
          artifact-name: aston-attestation-sdk-sbom
          upload-artifact: true
          upload-release-assets: ${{ github.event_name == 'release' }}
