name: Free Security Scanning

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks CLI
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.2
      - name: Scan for secrets
        run: "$(go env GOPATH)/bin/gitleaks git . --redact --verbose"

  python-security:
    name: Semgrep, Bandit and pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install hash-locked free community scanners
        run: python -m pip install --disable-pip-version-check --require-hashes -r security-tools.lock
      - name: Semgrep Python rules
        run: semgrep scan --config p/python --error --metrics=off .
      - name: Bandit Python security checks
        run: bandit -r . -ll
      - name: Audit hash-locked runtime dependencies
        run: pip-audit --timeout 60 -r requirements.lock
